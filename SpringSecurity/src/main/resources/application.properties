spring.application.name=SpringSecurity
server.port=8080

# SQL Server Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SpringSecurity;encrypt=false;trustServerCertificate=true;loginTimeout=30
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=kimdien2005

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialect cho SQL Server
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# Thymeleaf
spring.thymeleaf.cache=false